<!DOCTYPE html>
<!--
  TP3 - Ejercicio 1: Catálogo con buscador y carrito de compra (HTML + JavaScript + Bootstrap 5)
  Temática: MyTems, tienda online de ítems para videojuegos (continuación del proyecto del parcial 1)
  Los productos se cargan desde data/productos.json (hace falta un servidor: ver README.md)
  Autor: Facundo Saenz - Práctica Profesional I - Instituto Manuel Belgrano - 2026
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyTems - Catálogo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/catalogo.css" rel="stylesheet">
</head>
<body>

    <!-- ============ ENCABEZADO: logo, buscador y botón del carrito ============ -->
    <header class="encabezado sticky-top">
        <div class="container py-2">
            <div class="row align-items-center g-2">

                <div class="col-auto">
                    <a href="index.html" class="d-flex align-items-center text-decoration-none">
                        <img src="img/logo.png" alt="MyTems" class="logo">
                    </a>
                </div>

                <!-- Buscador por nombre (se filtra mientras se escribe) -->
                <div class="col">
                    <label for="buscador" class="visually-hidden">Buscar producto por nombre</label>
                    <input type="search" id="buscador" class="form-control" placeholder="Buscar producto…" autocomplete="off">
                </div>

                <!-- Botón que abre el carrito (offcanvas) -->
                <div class="col-auto">
                    <button class="btn btn-carrito position-relative" type="button"
                            data-bs-toggle="offcanvas" data-bs-target="#panelCarrito" aria-controls="panelCarrito">
                        &#128722; <span class="d-none d-sm-inline">Carrito</span>
                        <span id="contadorCarrito" class="badge rounded-pill insignia">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container my-4">
        <div class="row g-4">

            <!-- ============ FILTROS AVANZADOS ============ -->
            <aside class="col-12 col-lg-3">
                <!-- En celulares los filtros se pueden plegar -->
                <button class="btn btn-outline-secondary w-100 d-lg-none mb-2" type="button"
                        data-bs-toggle="collapse" data-bs-target="#filtros" aria-expanded="false" aria-controls="filtros">
                    Filtros y orden
                </button>

                <div class="collapse d-lg-block" id="filtros">
                    <form id="formFiltros" class="tarjeta p-3" autocomplete="off">
                        <h2 class="h6 text-uppercase fw-bold mb-3">Filtros</h2>

                        <div class="mb-3">
                            <label for="filtroJuego" class="form-label">Videojuego (categoría)</label>
                            <select id="filtroJuego" class="form-select">
                                <option value="">Todos</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="filtroTipo" class="form-label">Tipo de ítem (atributo)</label>
                            <select id="filtroTipo" class="form-select">
                                <option value="">Todos</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <span class="form-label d-block">Precio (USD)</span>
                            <div class="input-group">
                                <input type="number" id="precioMin" class="form-control" placeholder="Mín." min="0" step="0.01" aria-label="Precio mínimo">
                                <span class="input-group-text">a</span>
                                <input type="number" id="precioMax" class="form-control" placeholder="Máx." min="0" step="0.01" aria-label="Precio máximo">
                            </div>
                            <div id="errorPrecio" class="text-danger small mt-1 d-none">El mínimo no puede ser mayor que el máximo.</div>
                        </div>

                        <div class="mb-3">
                            <label for="orden" class="form-label">Ordenar por</label>
                            <select id="orden" class="form-select">
                                <option value="">Sin ordenar</option>
                                <option value="precio-asc">Precio: menor a mayor</option>
                                <option value="precio-desc">Precio: mayor a menor</option>
                                <option value="nombre">Nombre (A-Z)</option>
                            </select>
                        </div>

                        <button type="button" id="btnLimpiar" class="btn btn-outline-secondary w-100">Limpiar filtros</button>
                    </form>
                </div>
            </aside>

            <!-- ============ CATÁLOGO (cuadrícula) ============ -->
            <section class="col-12 col-lg-9">
                <div class="d-flex justify-content-between align-items-baseline mb-3">
                    <h1 class="h4 mb-0 titulo">Catálogo de productos</h1>
                    <p id="resultados" class="text-secondary small mb-0" aria-live="polite"></p>
                </div>

                <!-- Mensaje de error de carga (por ejemplo, abrir sin servidor) -->
                <div id="errorCarga" class="alert alert-danger d-none" role="alert"></div>

                <!-- Las tarjetas se generan desde js/app.js -->
                <div id="grilla" class="row g-3"></div>

                <!-- Mensaje cuando no hay coincidencias -->
                <div id="sinResultados" class="text-center text-secondary py-5 d-none">
                    <p class="h5">No encontramos productos con esos criterios.</p>
                    <button type="button" id="btnLimpiar2" class="btn btn-primario">Ver todo el catálogo</button>
                </div>
            </section>
        </div>
    </main>

    <footer class="pie text-center small py-4">
        &copy; 2026 MyTems - Game Items Online Shop (proyecto académico) &middot; Stock y precios de ejemplo
    </footer>

    <!-- ============ CUADRO MODAL: detalle del producto ============ -->
    <div class="modal fade" id="modalDetalle" tabindex="-1" aria-labelledby="modalTitulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="modalTitulo">Detalle</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3 align-items-center">
                        <div class="col-12 col-md-5">
                            <div class="marco-img"><img id="modalImg" src="" alt=""></div>
                        </div>
                        <div class="col-12 col-md-7">
                            <p class="mb-1"><span id="modalJuego" class="badge etiqueta"></span> <span id="modalTipo" class="badge etiqueta-gris"></span></p>
                            <p id="modalDetalleTexto" class="mt-2"></p>
                            <p class="h4 precio mb-1" id="modalPrecio"></p>
                            <p class="small text-secondary mb-0" id="modalStock"></p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primario" id="modalAgregar">Agregar al carrito</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ CARRITO (panel lateral) ============ -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="panelCarrito" aria-labelledby="tituloCarrito">
        <div class="offcanvas-header">
            <h2 class="offcanvas-title h5" id="tituloCarrito">Tu carrito</h2>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <p id="carritoVacio" class="text-secondary">Todavía no agregaste productos.</p>
            <ul id="listaCarrito" class="list-unstyled mb-3"></ul>

            <div id="resumenCarrito" class="mt-auto d-none">
                <div class="d-flex justify-content-between align-items-baseline border-top pt-3 mb-3">
                    <span class="fw-bold">Total</span>
                    <span class="h4 mb-0 precio" id="totalCarrito">$0</span>
                </div>
                <div class="d-grid gap-2">
                    <button type="button" class="btn btn-primario" id="btnComprar">Finalizar compra</button>
                    <button type="button" class="btn btn-outline-secondary" id="btnVaciar">Vaciar carrito</button>
                </div>
            </div>
            <div id="mensajeCompra" class="alert alert-success mt-3 d-none" role="status"></div>
        </div>
    </div>

    <!-- Aviso emergente (toast), por ejemplo "stock máximo alcanzado" -->
    <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
        <div id="toastAviso" class="toast align-items-center text-bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastTexto"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
